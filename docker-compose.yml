# Standalone Bumparr — runs next to your *arr stack on its own port.
# Point the volumes at your storage; edit config_files/ for your cams & fetch queue.
services:
  bumparr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bumparr
    ports:
      - "${PORT:-8780}:8780"
    environment:
      - ASSET_ROOT=/assets
      - DB_PATH=/data/bumparr.db
      - BRAND=${BRAND:-Bumparr}
      - BRAND_FONT=${BRAND_FONT:-RockSalt-Regular.ttf}
      - FONTS=${FONTS:-/container-assets/fonts}
      # Set behind a reverse proxy so emitted M3U / bumper URLs are absolute.
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Optional local model for the model-generated card kinds; blank = skip.
      # Grounded, procedural, and starter cards work with no model.
      - LLM_BASE=${LLM_BASE:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_DISABLE_THINKING=${LLM_DISABLE_THINKING:-}
      # Stock-footage keys for the shipped starter seeds (free self-signup).
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY:-}
      # Timezone for the clock card; containers are UTC without it.
      - TZ=${TZ:-UTC}
    volumes:
      # Your bumper library (rw so live-cam snippets + fetched PD content can land).
      - bumparr-assets:/assets:rw
      - bumparr-data:/data
      # - ./assets:/assets:rw
      # - ./data:/data
      # Application code is baked into the image. Do not bind-mount the Git
      # checkout here: Portainer replaces that checkout during stack updates,
      # which can make Python modules and web assets disappear mid-request.
      - ./container-assets:/container-assets:ro
    restart: unless-stopped

volumes:
  bumparr-data:
  bumparr-assets:
    name: bumparr-assets
